name: color-number
channels:
  - conda-forge
dependencies:
  - python=3.12
  - kivy=2.3.1
  - pillow
  - pillow-heif      # 读取 iPhone 的 HEIC 照片
  - numpy            # 照片转换和声音合成的计算
  - imageio          # 导出 MP4
  - imageio-ffmpeg   # 导出 MP4 需要的视频编码器
  - pytest           # 运行 tests 文件夹里的测试
  - certifi          # 在线图库联网时用的安全证书
  - pip
  - pip:
      # 只在 macOS 上安装：触控板手势和 AI 识别（Apple Vision）需要它们
      - pyobjc-framework-Cocoa; sys_platform == "darwin"
      - pyobjc-framework-Quartz; sys_platform == "darwin"
      - pyobjc-framework-Vision; sys_platform == "darwin"
